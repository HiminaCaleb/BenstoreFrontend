<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=./mr_d/">
  <title>Benstore Frontend - Delivery App Prototypes</title>
  <script>
    window.location.replace("./mr_d/");
  </script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #F7F8FA;
      color: #121212;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      padding: 36px 28px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #FFC200;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1.25rem;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(255, 194, 0, 0.4);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 8px;
    }
    p {
      color: #666;
      font-size: 0.95rem;
      margin: 0 0 24px;
      line-height: 1.4;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 24px;
      background: #FFC200;
      color: #121212;
      font-weight: 800;
      font-size: 1rem;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 150ms ease, background 150ms ease;
    }
    .btn:hover {
      background: #E5AC00;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">Mr D</div>
    <h1>Benstore Frontend</h1>
    <p>Redirecting to the Mr D reference delivery prototype...</p>
    <a href="./mr_d/" class="btn">Open Mr D Prototype →</a>
  </div>
</body>
</html>
